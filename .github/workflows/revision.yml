# Revisión pesada de HMS (flujo reutilizable): regresión visual, Lighthouse, accesibilidad y otras.
#
# Es caro, así que NUNCA se llama en cada push. El repositorio que lo usa debe dispararlo solo:
#   - a mano (workflow_dispatch), o
#   - cuando a un pull request le ponen la etiqueta `revision-completa` (pull_request: types [labeled]).
#
# Un solo trabajo, en fila: instala una vez y corre cada prueba que el repo le pase. Si una falla,
# las demás igual corren, y al final el trabajo queda en rojo. Los informes se suben solo si algo
# falla, por 3 días.

name: HMS · Revisión completa

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"
      lockfile:
        type: string
        default: package-lock.json
      php:
        type: boolean
        default: false
      php-version:
        type: string
        default: "8.3"
      php-extensions:
        type: string
        default: ""
      playwright:
        description: Instalar Chromium de Playwright (con caché).
        type: boolean
        default: true
      build:
        description: Build previo que comparten las pruebas. Vacío = cada prueba hace su build.
        type: string
        default: ""
      visual:
        description: Comando de la regresión visual. Vacío = se salta.
        type: string
        default: ""
      lighthouse:
        description: Comando de Lighthouse. Vacío = se salta.
        type: string
        default: ""
      a11y:
        description: Comando de accesibilidad. Vacío = se salta.
        type: string
        default: ""
      extra:
        description: Otras pruebas (seguridad, auditorías). Vacío = se salta.
        type: string
        default: ""
      artefactos:
        description: Rutas (una por línea) que se suben SOLO si algo falla, por 3 días.
        type: string
        default: ""
      timeout:
        type: number
        default: 45

permissions:
  contents: read

jobs:
  revision:
    name: Revisión completa
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}
    concurrency:
      group: hms-revision-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.lockfile }}

      - if: inputs.php
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: ${{ inputs.php-version }}
          extensions: ${{ inputs.php-extensions }}
          coverage: none

      - name: Instalar dependencias
        run: npm ci

      - name: Caché de Chromium (llave = lockfile)
        if: inputs.playwright
        id: pw-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles(inputs.lockfile) }}

      - name: Instalar Chromium
        if: inputs.playwright && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Dependencias del sistema para Chromium (caché encontrada)
        if: inputs.playwright && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build compartido
        if: inputs.build != ''
        run: ${{ inputs.build }}

      - name: Regresión visual
        if: ${{ !cancelled() && inputs.visual != '' }}
        env:
          CI: true
        run: ${{ inputs.visual }}

      - name: Lighthouse
        if: ${{ !cancelled() && inputs.lighthouse != '' }}
        env:
          CI: true
        run: ${{ inputs.lighthouse }}

      - name: Accesibilidad
        if: ${{ !cancelled() && inputs.a11y != '' }}
        env:
          CI: true
        run: ${{ inputs.a11y }}

      - name: Otras pruebas
        if: ${{ !cancelled() && inputs.extra != '' }}
        env:
          CI: true
        run: ${{ inputs.extra }}

      - name: Subir informes (solo si algo falló)
        if: failure() && inputs.artefactos != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: revision-informes
          path: ${{ inputs.artefactos }}
          retention-days: 3
          if-no-files-found: ignore
