# Despliegue de HMS a SiteGround por SSH con rsync (flujo reutilizable).
#
# Construye el sitio, lo sube por rsync SIN --delete (nunca borra lo que vive solo en el servidor),
# corre un script opcional después (subir PHP, .htaccess, purgar caché) y purga Cloudflare si le
# pasan el token.
#
# Las llaves NUNCA viven aquí: las pasa como `secrets` el repositorio que llama, desde su propia
# organización. Quien llama decide cuándo desplegar; la regla de HMS es: producción solo desde
# `main` y solo después de que el CI pase (workflow_run). Para reforzarla, `exigir-main: true`
# hace fallar el despliegue si se lanza desde otra rama.

name: HMS · Desplegar a SiteGround

on:
  workflow_call:
    inputs:
      destino:
        description: Nombre del destino, solo para el resumen (staging, produccion).
        type: string
        default: produccion
      ref:
        description: Commit exacto a desplegar (el que pasó el CI). Vacío = el del evento.
        type: string
        default: ""
      exigir-main:
        description: Fallar si el flujo no corre sobre la rama main.
        type: boolean
        default: true
      exigir-confirmacion:
        description: Exigir que `confirmacion` diga exactamente SUBIR A PRODUCCION.
        type: boolean
        default: false
      confirmacion:
        type: string
        default: ""
      runner:
        description: >-
          Dónde corre el trabajo, en JSON. Por defecto la máquina de GitHub ("ubuntu-latest").
          Un runner propio no gasta minutos de Actions, p. ej. '["self-hosted","hca-mac"]'.
        type: string
        default: '"ubuntu-latest"'
      node-version:
        type: string
        default: "22"
      lockfile:
        type: string
        default: package-lock.json
      build:
        description: Comando de build.
        type: string
        default: npm run build
      origen:
        description: Carpeta que se sube (con / al final).
        type: string
        default: dist/
      ruta:
        description: Ruta en el servidor (docroot). Vacía = se toma del secret `ruta`.
        type: string
        default: ""
      excluir:
        description: Patrones de rsync --exclude, uno por línea.
        type: string
        default: |
          .DS_Store
      despues:
        description: >-
          Script bash que corre después del rsync principal. Tiene a mano $RSH (comando ssh listo),
          $SSH_DEST (usuario@host) y $DOCROOT (ruta en el servidor). Para subir PHP, .htaccess,
          purgar la caché de SiteGround o revisar que todo quedó bien.
        type: string
        default: ""
      cloudflare-zona:
        description: Dominio de la zona de Cloudflare a purgar si no se pasa `cloudflare-zone-id`.
        type: string
        default: ""
    secrets:
      ssh-key:
        description: Llave privada SSH (sin passphrase) autorizada en SiteGround.
        required: true
      ssh-host:
        required: true
      ssh-user:
        required: true
      ssh-port:
        description: Puerto SSH. Si falta, 18765 (el de SiteGround).
        required: false
      ssh-known-hosts:
        description: Huella fija del servidor (línea de known_hosts). Si falta, se acepta la primera vez.
        required: false
      ruta:
        description: Ruta en el servidor, si el repo la guarda como secret.
        required: false
      cloudflare-token:
        description: Token con Zone > Cache Purge. Si falta, no se purga Cloudflare.
        required: false
      cloudflare-zone-id:
        required: false

permissions:
  contents: read

jobs:
  desplegar:
    name: Desplegar a ${{ inputs.destino }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 15
    # Los despliegues van en fila: nunca se cancela uno a medias.
    concurrency:
      group: hms-deploy-${{ github.repository }}-${{ inputs.destino }}
      cancel-in-progress: false
    steps:
      - name: Guardias (rama y confirmación)
        env:
          EXIGIR_MAIN: ${{ inputs.exigir-main }}
          EXIGIR_CONF: ${{ inputs.exigir-confirmacion }}
          CONFIRMACION: ${{ inputs.confirmacion }}
        run: |
          set -euo pipefail
          if [ "$EXIGIR_MAIN" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Este despliegue solo se permite desde main (llegó $GITHUB_REF)."
            exit 1
          fi
          if [ "$EXIGIR_CONF" = "true" ] && [ "$CONFIRMACION" != "SUBIR A PRODUCCION" ]; then
            echo "::error::Producción exige escribir exactamente 'SUBIR A PRODUCCION' en la confirmación."
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          # En un runner propio la caché de npm ya vive en la máquina: bajar la de GitHub (unos 3 GB) es más lento.
          cache: ${{ runner.environment == 'github-hosted' && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.lockfile }}

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: ${{ inputs.build }}

      - name: Normalizar el build (basura de macOS, permisos)
        env:
          ORIGEN: ${{ inputs.origen }}
        run: |
          set -euo pipefail
          find "$ORIGEN" -name '.DS_Store' -delete
          find "$ORIGEN" -type f -exec chmod 644 {} +
          find "$ORIGEN" -type d -exec chmod 755 {} +

      # La llave y la huella van en una carpeta temporal del trabajo, nunca en ~/.ssh: en un runner
      # propio, ~/.ssh es la del dueño de la máquina y no se toca. Se borran al terminar.
      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.ssh-key }}
          KNOWN_HOSTS: ${{ secrets.ssh-known-hosts }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?falta el secret ssh-key}"
          D="$RUNNER_TEMP/hms-ssh"
          mkdir -p "$D" && chmod 700 "$D"
          printf '%s\n' "$SSH_KEY" > "$D/id_deploy"
          chmod 600 "$D/id_deploy"
          echo "SSH_DIR=$D" >> "$GITHUB_ENV"
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > "$D/known_hosts"
            echo "HOSTCHECK=yes" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin huella fija del servidor (ssh-known-hosts): se acepta la primera vez."
            : > "$D/known_hosts"
            echo "HOSTCHECK=accept-new" >> "$GITHUB_ENV"
          fi
          chmod 600 "$D/known_hosts"

      - name: Subir el sitio (rsync SIN --delete)
        env:
          SG_HOST: ${{ secrets.ssh-host }}
          SG_USER: ${{ secrets.ssh-user }}
          SG_PORT: ${{ secrets.ssh-port }}
          RUTA_INPUT: ${{ inputs.ruta }}
          RUTA_SECRET: ${{ secrets.ruta }}
          ORIGEN: ${{ inputs.origen }}
          EXCLUIR: ${{ inputs.excluir }}
          DESPUES: ${{ inputs.despues }}
        run: |
          set -euo pipefail
          : "${SG_HOST:?falta el secret ssh-host}"
          : "${SG_USER:?falta el secret ssh-user}"
          DOCROOT="${RUTA_INPUT:-$RUTA_SECRET}"
          : "${DOCROOT:?falta la ruta (input ruta o secret ruta)}"
          DOCROOT="${DOCROOT%/}"
          PORT="${SG_PORT:-18765}"
          RSH="ssh -p $PORT -i $SSH_DIR/id_deploy -o IdentitiesOnly=yes -o UserKnownHostsFile=$SSH_DIR/known_hosts -o StrictHostKeyChecking=$HOSTCHECK -o BatchMode=yes -o ConnectTimeout=25"
          SSH_DEST="$SG_USER@$SG_HOST"
          export RSH SSH_DEST DOCROOT

          args=()
          while IFS= read -r patron; do
            [ -n "$patron" ] && args+=("--exclude=$patron")
          done <<< "$EXCLUIR"

          echo "rsync: $(command -v rsync) ($(rsync --version | head -1))"
          rsync -az --stats ${args[@]+"${args[@]}"} -e "$RSH" "$ORIGEN" "$SSH_DEST:$DOCROOT/"
          echo "::notice::Sitio subido a $DOCROOT"

          if [ -n "$DESPUES" ]; then
            echo "Corriendo el script de después del despliegue..."
            bash -euo pipefail -c "$DESPUES"
          fi

      - name: Purgar Cloudflare
        env:
          CF_TOKEN: ${{ secrets.cloudflare-token }}
          CF_ZONE: ${{ secrets.cloudflare-zone-id }}
          CF_NOMBRE: ${{ inputs.cloudflare-zona }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "Sin token de Cloudflare: no se purga el edge."
            exit 0
          fi
          ZONE_ID="$CF_ZONE"
          if [ -z "$ZONE_ID" ] && [ -n "$CF_NOMBRE" ]; then
            ZONE_ID=$(curl -sS "https://api.cloudflare.com/client/v4/zones?name=$CF_NOMBRE" \
              -H "Authorization: Bearer $CF_TOKEN" | jq -r '.result[0].id // empty')
          fi
          if [ -z "$ZONE_ID" ]; then
            echo "::warning::No se pudo resolver la zona de Cloudflare: no se purgó el edge."
            exit 0
          fi
          resp=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$resp" | jq -e '.success == true' >/dev/null \
            && echo "::notice::Cloudflare purgado." \
            || echo "::warning::La purga de Cloudflare no confirmó éxito."

      - name: Borrar la llave del trabajo
        if: always()
        run: rm -rf "$RUNNER_TEMP/hms-ssh"

      - name: Resumen
        env:
          DESTINO: ${{ inputs.destino }}
        run: echo "Desplegado a $DESTINO (commit ${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"
